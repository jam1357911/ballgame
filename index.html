  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('全螢幕', fb.x + fb.w / 2, fb.y + fb.h / 2 + 0.5);
  ctx.restore();
}

/* 精簡計分條（手機直度） */
function drawCompactBar(t) {
  var y0 = TITLE_H, h = HUD_H - TITLE_H;

  var g = ctx.createLinearGradient(0, y0, 0, y0 + h);
  g.addColorStop(0, '#191922');
  g.addColorStop(1, '#0a0a12');
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, LW, h);

  var lg = ctx.createLinearGradient(0, 0, LW, 0);
  lg.addColorStop(0, 'rgba(255,80,200,0.55)');
  lg.addColorStop(0.5, 'rgba(120,180,255,0.6)');
  lg.addColorStop(1, 'rgba(80,255,200,0.55)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, y0 + h - 2, LW, 2);

  ctx.textBaseline = 'alphabetic';

  // 分數
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(150,190,240,0.85)';
  ctx.font = '600 8.5px "Segoe UI", sans-serif';
  ctx.fillText('SCORE', 12, y0 + 15);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 21px "Consolas", monospace';
  ctx.fillText(fmt(game.score), 11, y0 + 40);

  // 倍數
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(150,190,240,0.85)';
  ctx.font = '600 8.5px "Segoe UI", sans-serif';
  ctx.fillText('MULT', LW * 0.56, y0 + 15);
  ctx.fillStyle = game.mult > 1 ? '#ffe066' : 'rgba(180,198,235,0.9)';
  ctx.font = '700 19px "Consolas", monospace';
  ctx.fillText('×' + game.mult, LW * 0.56, y0 + 38);

  // 球
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffb1a0';
  ctx.font = '700 14px "Segoe UI", "Microsoft JhengHei", sans-serif';
  ctx.fillText('BALL ' + ballNumber(), LW - 12, y0 + 20);
  for (var i = 0; i < 3; i++) {
    var cx = LW - 14 - (2 - i) * 15;
    ctx.beginPath();
    ctx.arc(cx, y0 + 36, 4.6, 0, TAU);
    ctx.fillStyle = i < game.ballsLeft ? '#eef2fa' : 'rgba(120,130,160,0.3)';
    ctx.fill();
  }
}

/* ---------------- 立體邊框工具 ---------------- */
function bevel(x, y, w, h, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 0.5, y + h - 0.5);
  ctx.lineTo(x + 0.5, y + 0.5);
  ctx.lineTo(x + w - 0.5, y + 0.5);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(18,18,26,0.6)';
  ctx.beginPath();
  ctx.moveTo(x + w - 0.5, y + 0.5);
  ctx.lineTo(x + w - 0.5, y + h - 0.5);
  ctx.lineTo(x + 0.5, y + h - 0.5);
  ctx.stroke();
}

function sink(x, y, w, h) {
  ctx.fillStyle = '#bdb9b1';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(18,18,26,0.65)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 0.5, y + h - 0.5);
  ctx.lineTo(x + 0.5, y + 0.5);
  ctx.lineTo(x + w - 0.5, y + 0.5);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.moveTo(x + w - 0.5, y + 0.5);
  ctx.lineTo(x + w - 0.5, y + h - 0.5);
  ctx.lineTo(x + 0.5, y + h - 0.5);
  ctx.stroke();
}

/* ---------------- 右側資訊面板 ---------------- */
function ballNumber() { return Math.min(3, Math.max(1, 4 - game.ballsLeft)); }

function statusText() {
  if (game.mode === 'attract') return 'Press Start';
  if (game.mode === 'over') return 'Game Over';
  if (!ball.active) return 'Ball Drained';
  if (canLaunch()) return 'Awaiting Deployment';
  if (game.mult > 1) return 'Rank Bonus ×' + game.mult;
  return 'Good Luck, Cadet';
}

function wrapLines(text, maxW, font) {
  ctx.save();
  ctx.font = font;
  var words = text.split(' ');
  var lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  ctx.restore();
  return lines;
}

function drawPanel(t) {
  var x0 = PANEL_X, y0 = HUD_H, w = PANEL_W, h = PH;

  ctx.fillStyle = '#2f2f38';
  ctx.fillRect(x0, y0, w, h);
  bevel(x0 + 4, y0 + 4, w - 8, h - 8, '#c8c5bf');

  var ix = x0 + 14, iw = w - 28;

  /* 標誌箱 */
  var ly = y0 + 14, lh = 186;
  ctx.save();
  ctx.beginPath(); ctx.rect(ix, ly, iw, lh); ctx.clip();
  drawLogoArt(ix, ly, iw, lh, t);
  ctx.restore();
  ctx.strokeStyle = 'rgba(20,20,30,0.7)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(ix + 0.5, ly + 0.5, iw - 1, lh - 1);

  /* BALL n */
  var by = ly + lh + 28;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#b12a1d';
  ctx.font = '700 23px "Segoe UI", "Microsoft JhengHei", sans-serif';
  ctx.fillText('BALL ' + ballNumber(), ix + iw, by);
  ctx.strokeStyle = 'rgba(150,60,45,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ix, by + 7); ctx.lineTo(ix + iw, by + 7); ctx.stroke();

  /* 分數格 */
  var sy = by + 17, sh = 50, bw = (iw - 8) / 2;
  sink(ix, sy, bw, sh);
  sink(ix + bw + 8, sy, bw, sh);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#15151b';
  ctx.font = '700 16px "Consolas", "Menlo", monospace';
  ctx.fillText(fmt(game.score), ix + bw / 2, sy + 35);
  ctx.fillText(fmt(game.best), ix + bw + 8 + bw / 2, sy + 35);

  ctx.fillStyle = 'rgba(70,66,60,0.85)';
  ctx.font = '600 8.5px "Segoe UI", sans-serif';
  ctx.fillText('SCORE', ix + bw / 2, sy + 13);
  ctx.fillText('BEST', ix + bw + 8 + bw / 2, sy + 13);

  /* PLAYER 1 */
  var py = sy + sh + 12;
  sink(ix, py, iw, 34);
  ctx.fillStyle = '#22222a';
  ctx.font = '700 16px "Segoe UI", "Microsoft JhengHei", sans-serif';
  ctx.fillText('Player 1', ix + iw / 2, py + 23);

  /* 狀態箱 */
  var ty2 = py + 46, th = 96;
  sink(ix, ty2, iw, th);
  ctx.save();
  ctx.beginPath(); ctx.rect(ix + 3, ty2 + 3, iw - 6, th - 6); ctx.clip();
  var sfont = 'italic 700 16px "Microsoft JhengHei", "Segoe UI", sans-serif';
  ctx.fillStyle = '#3a2f78';
  ctx.font = sfont;
  ctx.textAlign = 'center';
  var lines = wrapLines(statusText(), iw - 16, sfont);
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], ix + iw / 2, ty2 + 32 + i * 22);
  }
  ctx.restore();

  /* 倍數 / 任務 */
  var my = ty2 + th + 28;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(70,66,60,0.9)';
  ctx.font = '600 9px "Segoe UI", sans-serif';
  ctx.fillText('MULTIPLIER', ix + iw * 0.28, my);
  ctx.fillText('COMBO', ix + iw * 0.72, my);

  ctx.fillStyle = game.mult > 1 ? '#b8302a' : '#4a4658';
  ctx.font = '700 22px "Consolas", monospace';
  ctx.fillText('×' + game.mult, ix + iw * 0.28, my + 24);

  var cm = comboMult();
  ctx.fillStyle = game.combo >= 6 ? '#c0392b' : (game.combo > 0 ? '#0e7f8f' : '#4a4658');
  ctx.font = '700 20px "Consolas", monospace';
  ctx.fillText('×' + cm.toFixed(2), ix + iw * 0.72, my + 24);

  /* 剩餘球 */
  var by2 = my + 46;
  ctx.fillStyle = 'rgba(70,66,60,0.9)';
  ctx.font = '600 9px "Segoe UI", sans-serif';
  ctx.fillText('BALLS LEFT', ix + iw / 2, by2);
  for (var b2 = 0; b2 < 3; b2++) {
    var cx2 = ix + iw / 2 - 24 + b2 * 24;
    var cy2 = by2 + 19;
    if (b2 < game.ballsLeft) {
      var bg2 = ctx.createRadialGradient(cx2 - 1.5, cy2 - 2, 0.5, cx2, cy2, 7);
      bg2.addColorStop(0, '#ffffff');
      bg2.addColorStop(0.5, '#aeb7c9');
      bg2.addColorStop(1, '#3f4658');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.arc(cx2, cy2, 7, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(30,34,48,0.75)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx2, cy2, 7, 0, TAU); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(110,106,98,0.45)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, TAU); ctx.stroke();
    }
  }

  /* 操作提示 */
  ctx.fillStyle = 'rgba(66,62,58,0.85)';
  ctx.font = '600 10px "Microsoft JhengHei", "Segoe UI", sans-serif';
  ctx.fillText('← → / A D　擊拍', ix + iw / 2, by2 + 56);
  ctx.fillText('Space　長按拉彈簧', ix + iw / 2, by2 + 74);

  /* 目標牌進度 */
  var gy = by2 + 108;
  ctx.fillStyle = 'rgba(70,66,60,0.9)';
  ctx.font = '600 9px "Segoe UI", sans-serif';
  ctx.fillText('TARGET BANKS', ix + iw / 2, gy);

  for (var bk = 0; bk < 2; bk++) {
    var bankName = bk === 0 ? 'L' : 'R';
    var cnt = 0, tot = 0;
    for (var tq = 0; tq < targets.length; tq++) {
      if (targets[tq].bank === bankName) { tot++; if (targets[tq].lit) cnt++; }
    }
    var ry = gy + 18 + bk * 20;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(52,48,44,0.9)';
    ctx.font = '700 10px "Consolas", monospace';
    ctx.fillText(bankName, ix + 8, ry);
    for (var q = 0; q < tot; q++) {
      ctx.fillStyle = q < cnt ? '#c0392b' : 'rgba(122,116,106,0.5)';
      ctx.fillRect(ix + 26 + q * 14, ry - 9, 10, 10);
    }
    ctx.textAlign = 'center';
  }

  /* 底部高分 */
  var hy = HUD_H + PH - 56;
  ctx.strokeStyle = 'rgba(122,116,106,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ix, hy - 18); ctx.lineTo(ix + iw, hy - 18); ctx.stroke();

  ctx.fillStyle = 'rgba(70,66,60,0.9)';
  ctx.font = '600 9px "Segoe UI", sans-serif';
  ctx.fillText('HIGH SCORE', ix + iw / 2, hy);
  ctx.fillStyle = '#8a2f24';
  ctx.font = '700 17px "Consolas", monospace';
  ctx.fillText(fmt(game.best), ix + iw / 2, hy + 21);

  ctx.fillStyle = 'rgba(120,114,104,0.75)';
  ctx.font = '600 8px "Consolas", monospace';
  ctx.fillText('CINEMATRONICS · SPACE CADET', ix + iw / 2, hy + 38);
}

function drawLogoArt(x, y, w, h, t) {
  var g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#2a1350');
  g.addColorStop(0.55, '#180b30');
  g.addColorStop(1, '#0b0518');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);

  // 星點
  for (var i = 0; i < 26; i++) {
    var sx = x + 4 + ((i * 53) % (w - 10));
    var sy2 = y + 4 + ((i * 71) % (h - 12));
    var tw = 0.3 + 0.45 * Math.abs(Math.sin(t * 1.4 + i));
    ctx.fillStyle = 'rgba(228,234,255,' + tw.toFixed(2) + ')';
    ctx.fillRect(sx, sy2, 1.6, 1.6);
  }

  // 環狀行星
  var px = x + 32, py2 = y + h - 38;
  ctx.beginPath(); ctx.arc(px, py2, 14, 0, TAU);
  ctx.fillStyle = 'rgba(122,168,92,0.9)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(206,224,176,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(px, py2, 24, 7, -0.35, 0, TAU);
  ctx.stroke();

  // 文字
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#dbe6ff';
  ctx.font = 'italic 700 14px "Segoe UI", "Microsoft JhengHei", sans-serif';
  ctx.fillText('3D Pinball', x + 12, y + 26);

  ctx.save();
  ctx.translate(x + 12, y + 78);
  ctx.rotate(-0.05);
  ctx.shadowColor = 'rgba(158,120,255,0.9)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#dccbff';
  ctx.font = 'italic 800 29px "Palatino Linotype", "Georgia", serif';
  ctx.fillText('Space', 0, 0);
  ctx.fillText('Cadet', 7, 33);
  ctx.restore();

  // 太空艙
  drawCapsule(x + w - 58, y + h - 44, 0.85);
}

function drawCapsule(cx, cy, s) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);

  ctx.beginPath();
  ctx.moveTo(-26, 6);
  ctx.quadraticCurveTo(-20, -14, 4, -16);
  ctx.quadraticCurveTo(24, -16, 30, 0);
  ctx.quadraticCurveTo(24, 12, 4, 12);
  ctx.quadraticCurveTo(-16, 12, -26, 6);
  ctx.closePath();
  ctx.fillStyle = '#e9e7f0';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,112,152,0.9)';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(10, -2, 8, 0, TAU);
  ctx.fillStyle = '#7fd0ff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(58,58,88,0.9)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath(); ctx.arc(6, -4, 3.4, 0, TAU);
  ctx.fillStyle = 'rgba(255,240,220,0.95)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-26, 0);
  ctx.lineTo(-38, -5);
  ctx.lineTo(-31, 4);
  ctx.lineTo(-38, 9);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,172,60,0.92)';
  ctx.fill();

  ctx.restore();
}

/* ---------------- 覆蓋層 ---------------- */
function drawOverlay(t) {
  ctx.save();
  ctx.translate(0, HUD_H);

  ctx.fillStyle = 'rgba(4,6,18,0.80)';
  ctx.fillRect(0, 0, TABLE_W, PH);

  ctx.textAlign = 'center';

  if (game.mode === 'attract' || game.mode === 'over') {
    var titleY = 296;
    var bob = Math.sin(t * 1.6) * 4;
    var mid = TABLE_W / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(172,140,255,0.95)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#dccbff';
    ctx.font = 'italic 800 46px "Palatino Linotype", "Georgia", serif';
    ctx.fillText('Space Cadet', mid, titleY + bob);
    ctx.restore();

    ctx.save();
    ctx.shadowColor = 'rgba(120,180,255,0.85)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#9fd2ff';
    ctx.font = '700 15px "Consolas", "Segoe UI", sans-serif';
    ctx.fillText('3 D   P I N B A L L   F O R   W I N D O W S', mid, titleY + 30 + bob);
    ctx.restore();

    if (game.mode === 'over') {
      ctx.fillStyle = 'rgba(255,140,120,0.95)';
      ctx.font = '800 28px "Microsoft JhengHei", sans-serif';
      ctx.fillText('遊戲結束', mid, titleY + 110);

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 42px "Consolas", monospace';
      ctx.fillText(fmt(game.score), mid, titleY + 164);

      ctx.fillStyle = 'rgba(255,226,120,0.9)';
      ctx.font = '600 15px "Microsoft JhengHei", sans-serif';
      ctx.fillText('最高分 ' + fmt(game.best), mid, titleY + 192);
    }

    var y0 = game.mode === 'over' ? titleY + 244 : titleY + 92;
    ctx.fillStyle = 'rgba(198,206,240,0.85)';
    ctx.font = '600 14px "Microsoft JhengHei", sans-serif';
    ctx.fillText('← → / A D　　擊拍', mid, y0);
    ctx.fillText('Space / 長按右下方　　拉彈簧發射', mid, y0 + 26);
    ctx.fillText('碰碰柱 100　彈弓 50　目標牌 150　清牌組 +1000', mid, y0 + 58);

    var a = 0.5 + Math.sin(t * 4) * 0.5;
    ctx.globalAlpha = 0.45 + a * 0.55;
    ctx.fillStyle = '#cfc0ff';
    ctx.font = '700 18px "Microsoft JhengHei", sans-serif';
    ctx.shadowColor = 'rgba(160,120,255,0.9)';
    ctx.shadowBlur = 16;
    ctx.fillText(game.mode === 'over' ? '按 ENTER 或點擊檯面　再玩一次' : '按 ENTER 或點擊檯面　開始', mid, y0 + 108);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* =========================================================
   10 · 主循環
   ========================================================= */
var lastT = 0;
var accT = 0;

function render() {
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  ctx.fillStyle = '#04060d';
  ctx.fillRect(0, 0, LW, CH);

  drawChrome(game.time);

  ctx.save();
  if (game.shake > 0.05) {
    ctx.translate(rnd(-game.shake, game.shake), rnd(-game.shake, game.shake));
  }
  ctx.translate(0, HUD_H);
  drawPlayfield(game.time);
  ctx.restore();

  if (!compact) drawPanel(game.time);

  if (game.mode !== 'play') drawOverlay(game.time);

  if (landscapeHint && landscapeWarn > 0) drawLandscapeBanner();
}

function drawLandscapeBanner() {
  var a = Math.min(1, landscapeWarn / 0.6);
  var w = 230, h = 40;
  var x = (LW - w) / 2, y = HUD_H + 8;

  ctx.save();
  ctx.globalAlpha = a;
  rr(x, y, w, h, 20);
  ctx.fillStyle = 'rgba(6,9,24,0.86)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(160,190,255,0.75)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.fillStyle = '#cfe0ff';
  ctx.font = '700 13px "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('建議轉回直向玩', LW / 2, y + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function loop(now) {
  requestAnimationFrame(loop);
  if (FROZEN) { render(); lastT = now; return; }
  if (!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  accT += dt;
  var iter = 0;
  while (accT >= DT && iter < 96) {
    physics(DT);
    accT -= DT;
    iter++;
  }
  if (iter >= 96) accT = 0;

  update(dt);
  render();
}

/* =========================================================
   11 · 啟動
   ========================================================= */
resize();
render();

var Q = new URLSearchParams(window.location.search);
var FROZEN = Q.has('freeze');

if (Q.has('sim')) {
  // 除錯用：?sim=3&freeze=1 快轉三秒後定格
  var secs = parseFloat(Q.get('sim'));
  if (isNaN(secs)) secs = 2;
  secs = Math.max(0, Math.min(30, secs));
  startGame();
  launchBall(1);
  var steps = Math.floor(secs / DT);
  for (var si = 0; si < steps; si++) {
    physics(DT);
    update(DT);
  }
}

lastT = 0;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
